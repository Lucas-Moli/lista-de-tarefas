[package]
name = "todo-tauri"
version = "1.0.0"
description = "Aplicação desktop To-Do List com Tauri, Rust e SQLite"
authors = ["Projeto educacional"]
edition = "2021"

[lib]
name = "todo_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.11.6", features = [] }
thiserror = "2.0.20"
